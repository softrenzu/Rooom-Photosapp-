name: Signed TestFlight and App Store Release

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: Submit version 1.0.0 to App Review after upload
        required: true
        type: boolean
        default: false
      subscription_review_ready:
        description: Confirm the ¥500 monthly subscription is complete and added to this app review
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store-production
    env:
      APPLE_TEAM_ID: FP4P58VA5F

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install project and release tools
        run: |
          brew install xcodegen
          bundle config set path vendor/bundle
          bundle install

      - name: Validate release secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=0
          for name in GOOGLE_CLIENT_ID GOOGLE_REVERSED_CLIENT_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing from GitHub environment app-store-production"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure app and signing credentials
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          {
            echo "GOOGLE_CLIENT_ID = $GOOGLE_CLIENT_ID"
            echo "GOOGLE_REVERSED_CLIENT_ID = $GOOGLE_REVERSED_CLIENT_ID"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          } > Configuration/Secrets.xcconfig
          xcodegen generate

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive app with Apple cloud signing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project RooomShot.xcodeproj \
            -scheme RooomShot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RooomShot.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export App Store IPA with Apple cloud signing
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cp Configuration/ExportOptions.plist build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/RooomShot.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Generate validated App Store screenshots
        run: bash scripts/generate_screenshots.sh

      - name: Upload metadata, IPA, and optionally submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IPA_PATH: build/export/RooomShot.ipa
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          SUBSCRIPTION_REVIEW_READY: ${{ inputs.subscription_review_ready }}
        run: bundle exec fastlane ios submit

      - uses: actions/upload-artifact@v4
        with:
          name: RooomShot-Signed-IPA
          path: build/export/RooomShot.ipa
          if-no-files-found: error
