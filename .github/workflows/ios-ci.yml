name: iOS 26 Build, Tests, and Screenshots

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Validate repository
        run: bash scripts/validate_repository.sh

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project RooomShot.xcodeproj -scheme RooomShot

      - name: Run unit and UI tests
        run: |
          xcodebuild test \
            -project RooomShot.xcodeproj \
            -scheme RooomShot \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest' \
            -resultBundlePath build/RooomShotTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RooomShot-Test-Results
          path: build/RooomShotTests.xcresult
          if-no-files-found: warn

  screenshots:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Validate repository
        run: bash scripts/validate_repository.sh

      - name: Generate App Store screenshots
        run: bash scripts/generate_screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: RooomShot-App-Store-Screenshots
          path: fastlane/screenshots
          if-no-files-found: error
