name: Signed TestFlight and App Store Release

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: Submit version 1.0.0 to App Review after upload
        required: true
        type: boolean
        default: false
      subscription_review_ready:
        description: Confirm the ¥500 monthly subscription is complete and added to this app review
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store-production

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install project and release tools
        run: |
          brew install xcodegen
          bundle config set path vendor/bundle
          bundle install

      - name: Configure Google OAuth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "GOOGLE_CLIENT_ID = $GOOGLE_CLIENT_ID"
            echo "GOOGLE_REVERSED_CLIENT_ID = $GOOGLE_REVERSED_CLIENT_ID"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
          } > Configuration/Secrets.xcconfig
          xcodegen generate

      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/RooomShotDistribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/RooomShot.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/RooomShot.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project RooomShot.xcodeproj \
            -scheme RooomShot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RooomShot.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cp Configuration/ExportOptions.plist build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" build/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.rooomtech.rooomshot string $PROFILE_NAME" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/RooomShot.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: Generate validated App Store screenshots
        run: bash scripts/generate_screenshots.sh

      - name: Upload metadata, IPA, and optionally submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IPA_PATH: build/export/RooomShot.ipa
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
          SUBSCRIPTION_REVIEW_READY: ${{ inputs.subscription_review_ready }}
        run: bundle exec fastlane ios submit

      - uses: actions/upload-artifact@v4
        with:
          name: RooomShot-Signed-IPA
          path: build/export/RooomShot.ipa
          if-no-files-found: error
